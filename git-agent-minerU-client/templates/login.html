<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 华通物料智能分析平台</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">

<div class="login-card">
  <div class="login-brand">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    <h1>华通物料智能分析平台</h1>
    <p>基于 agent-minerU 的物料文件智能解析系统</p>
  </div>

  <div class="login-tabs">
    <div class="login-tab active" data-tab="login">登 录</div>
    <div class="login-tab" data-tab="register">注册账号</div>
  </div>

  <!-- 登录表单 -->
  <form id="loginForm" autocomplete="off">
    <div class="form-item">
      <label>用户名</label>
      <input class="input" id="loginUsername" placeholder="请输入用户名" required>
    </div>
    <div class="form-item">
      <label>密码</label>
      <input class="input" id="loginPassword" type="password" placeholder="请输入密码" required>
    </div>
    <div class="form-err" id="loginErr"></div>
    <button type="submit" class="btn btn-primary login-btn">登 录</button>
    <div class="login-hint">
      内置管理员账号：admin / admin123<br>
      普通员工注册后，功能菜单需管理员授权后可见
    </div>
  </form>

  <!-- 注册表单 -->
  <form id="registerForm" autocomplete="off" class="hidden">
    <div class="form-item">
      <label>员工工号</label>
      <input class="input" id="regStaffId" placeholder="例如：HT0001" required>
    </div>
    <div class="form-item">
      <label>姓名</label>
      <input class="input" id="regRealName" placeholder="请输入真实姓名">
    </div>
    <div class="form-item">
      <label>用户名</label>
      <input class="input" id="regUsername" placeholder="登录用户名，至少 2 个字符" required>
    </div>
    <div class="form-item">
      <label>密码</label>
      <input class="input" id="regPassword" type="password" placeholder="至少 6 位" required>
    </div>
    <div class="form-item">
      <label>确认密码</label>
      <input class="input" id="regPassword2" type="password" placeholder="再次输入密码" required>
    </div>
    <div class="form-err" id="regErr"></div>
    <button type="submit" class="btn btn-primary login-btn">注册并登录</button>
  </form>
</div>

<script src="/static/js/login.js"></script>
</body>
</html>
